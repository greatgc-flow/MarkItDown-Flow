# Applicability declaration for the generated MECE matrices (30_TESTPLAN section 5, R20).
#
# This file holds applicability ONLY. Coverage is generated from `@pytest.mark.cov`/`fx` markers and the
# fixture manifest; nothing here claims a test exists. A cell that is neither registered to an assertion nor
# listed below fails `tools/trace.py check` (T-META-04). A listed cell that is also registered is displayed as registered.
#
# Schema (the verifier is tools/trace.py `matrix_problems`, implemented registration verifier):
#   [[stage_fm]]  cross product `stages` x `fms` of the 14x13 stage/failure-mode grid (S0..S13 x FM0..FM12)
#   [[class_stage]] cross product `classes` x `stages` of the 20x14 file-class/stage grid (K01..K20 x S0..S13)
#   reason  why the cell cannot occur or is not separately testable (must be non-empty prose)
#   owner   stage_fm: the "S<n>:FM<m>" cell that tests the condition instead
#           class_stage: "S<n>:K<nn>" (explicit cell) or "S<n>" (the SAME class at stage S<n>)
#
# R28: fx("all") expands only at S0-S3/S13. Later stages require explicit consumed fixture IDs.
# scope("schema") assertions contribute only common equivalences to the registration view;
# class execution registrations exclude them, and passing execution still requires JUnit evidence.
#
# FLOOR (30_TESTPLAN section 5) is never declared here: all S3 x FM0/1/2/3/4/10/11/12; S1:FM1/2/3/9; S2:FM1/10;
# S6:FM1/3; S7:FM1/5; S9:FM8; S10:FM6/7; S12:FM5/9; S0:FM7/10/12; every class x S3, S13, and (except the
# report-only K12 K13 K15 K16 K17 K19) S11.
#
# M1: applicability and registration are distinct from executed JUnit evidence.
# Common schema equivalences are labelled scope(schema); class execution registrations are separate.
# Previously declared nominal/report gaps now have directly registered scenarios.

