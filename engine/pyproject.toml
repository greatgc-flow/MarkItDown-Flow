[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "mdflow"
version = "2.1.0"
description = "Local Markdown conversion for documents with complete direct text."
license = "MIT"
requires-python = ">=3.10"
dependencies = ["markitdown-gc>=0.3.10,<0.4", "pypdfium2>=5.15.2,<6", "Pillow>=11,<14"]

[project.scripts]
mdflow = "mdflow.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mdflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-markers"
junit_family = "xunit2"
markers = [
    "integration: real optional external tool; skip only when absent",
    "soffice: real LibreOffice integration; required in dedicated legacy-libreoffice CI",
    "req(*ids): normative requirements asserted by the test",
    "cov(stage, failure_mode): exactly one primary matrix cell",
    "fx(*ids): fixture IDs, or all",
    "plat(platform): collect only on posix or windows",
    "scope(kind): schema or execution; common schema is not class execution",
]
