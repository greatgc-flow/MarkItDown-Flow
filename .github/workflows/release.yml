name: Release Obsidian Plugin

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18.x"

      - name: Build plugin
        run: |
          cd plugin
          npm install
          npm run build

      - name: Bundle Python Engine
        run: |
          # Create engine zip to attach to the release (optional, since it's copied by the plugin on start, but good for backup)
          zip -r engine.zip engine/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            plugin/main.js
            plugin/manifest.json
            plugin/styles.css
            engine.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
