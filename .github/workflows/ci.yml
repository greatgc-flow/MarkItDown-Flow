name: Inspect 2.0.2 candidate receipts

on:
  push:
    branches: ['verify/2.0.2-receipts']

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CANDIDATE: '4cf945dab29597e01ecae2dea89801d96d93fab9'
      CI_RUN: '45688907760'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: '4cf945dab29597e01ecae2dea89801d96d93fab9'
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - name: Verify candidate CI run and identify the archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          actual="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN" --jq '[.head_sha, .event, .conclusion] | join(" ")')"
          test "$actual" = "$CANDIDATE push success"
          echo "$actual"
          archive="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN/artifacts?name=acceptance-evidence" --jq '.artifacts[] | [.id, .digest] | @tsv')"
          read -r artifact_id digest <<< "$archive"
          test "$artifact_id" = 15059301965
          test "$digest" = sha256:786066fb1fd768d250d3354eeccfb10c349efabe08a4a76c13ad177743dd808a
          echo "$artifact_id $digest"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: '45688907760'
          name: acceptance-evidence
          path: build/inspection
      - run: |
          python -m pip install --only-binary=:all: -r engine/requirements-build.txt
      - name: Cross-check raw receipts and evaluate all candidate gates
        run: |
          python - <<'PY'
          import fnmatch
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          from xml.etree import ElementTree
          
          root = Path.cwd()
          receipts = root / 'build/inspection'
          commit = os.environ['CANDIDATE']
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == commit
          sys.path.insert(0, str(root / 'tools'))
          from release_evidence import generate_oracles
          from trace import execution_receipt
          
          selectors = {
              'G-03': ['T-CLS-*', 'T-META-03', 'CT-02', 'CT-03', 'T-CLI-03'],
              'G-05': ['T-ASM-06', 'T-ASM-15', 'T-ASM-16', 'T-RPT-02', 'T-MAP-*', 'T-TRX-01', 'T-SEL-04', 'T-CLS-12'],
              'G-06': ['T-GEN-06', 'T-GEN-11', 'T-ASM-09', 'T-ASM-10', 'T-CNV-04', 'T-LKP-01', 'T-LKP-02', 'T-LKP-03', 'T-APR-06', 'T-TRX-06'],
          }
          for os_name in ('ubuntu-24.04', 'windows-2022', 'macos-26'):
              for python in ('3.10', '3.14'):
                  stem = f'engine-{os_name}-py{python}'
                  collection_path = receipts / f'collection-{stem}.json'
                  registry_path = receipts / f'registry-{stem}.json'
                  xml_path = receipts / f'junit-{stem}.xml'
                  collection = json.loads(collection_path.read_bytes())
                  registry = json.loads(registry_path.read_bytes())
                  assert collection['commit'] == registry['commit'] == commit
                  assert hashlib.sha256(collection_path.read_bytes()).hexdigest() == registry['collection_sha256']
                  collected = {r['nodeid']: r['tid'] for r in collection['tests']}
                  selected = {r['nodeid']: r['tid'] for r in registry['tests'] if r['selected']}
                  actual = {}
                  for case in ElementTree.parse(xml_path).iter('testcase'):
                      props = {p.get('name'): p.get('value') for p in case.findall('./properties/property')}
                      node = props['nodeid']
                      assert node not in actual
                      actual[node] = (props['tid'], all(case.find(flag) is None for flag in ('failure', 'skipped', 'error')))
                  assert actual.keys() == selected.keys()
                  assert all(selected[node] == actual[node][0] for node in selected)
                  print('SOURCE', stem, 'candidate', commit, 'junit-sha256', hashlib.sha256(xml_path.read_bytes()).hexdigest())
                  for gate, patterns in selectors.items():
                      matches = {n:t for n,t in collected.items() if any(fnmatch.fnmatchcase(t, p) for p in patterns)}
                      assert all(any(fnmatch.fnmatchcase(t, p) for t in matches.values()) for p in patterns)
                      assert all(actual.get(n) == (t, True) for n,t in matches.items())
                      print('PEER-CHECK', gate, stem, 'cases', len(matches), 'ids', len(set(matches.values())), 'passed')
              shell = f'junit-shell-{os_name}.xml'
              rows, result = execution_receipt(receipts, shell, commit, root=root)
              description = 'setup and provider settings link to the release disclosures in English and Korean'
              matched = [r['nodeid'] for r in rows if r['tid'] == 'JT-04' and r['nodeid'].endswith(description)]
              assert len(matched) == 1 and result.get(matched[0]) is True
              print('SHELL-CHECK', os_name, matched[0], 'passed; total', sum(result.values()))
          gates = generate_oracles(root, receipts, commit, {})
          for key in sorted(k for k in gates if re.fullmatch(r'G-\d\d', k)):
              print('RELEASE-CHECK', key, gates[key]['result'], 'source-files', len(gates[key]['sources']))
          assert len([k for k in gates if re.fullmatch(r'G-\d\d', k)]) == 17
          assert all(gates[g]['result'] != 'FAIL' for g in ('G-10', 'G-11'))
          PY
