name: v2 candidate checks

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          architecture: x64
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
      - run: python -m pip install "--only-binary=:all:" -r engine/requirements-build.txt
      - name: Build candidate once (publication uses these exact bytes)
        run: python tools/build_release.py --tag 2.0.0
      - name: Reference-target complete closure and tamper checks
        env:
          MDFLOW_RELEASE_BUNDLE: ${{ github.workspace }}/build/candidate
        run: |
          python -m pip install --only-binary=:all: -r engine/requirements-test.txt
          python -I -m pytest engine/tests/packaging -k PT_02 -q --junitxml=build/trace/junit-reference.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: reference-evidence
          path: |
            build/trace/
            !build/trace/redgreen/*-tmp/**
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: build/candidate/
          if-no-files-found: error

  pytest:
    needs: candidate
    runs-on: ${{ matrix.os }}
    env:
      MDFLOW_TEST_INSTALLED: '1'
      MDFLOW_CI_TARGET: ${{ matrix.os }}
    continue-on-error: ${{ matrix.python == '3.15' || matrix.os == 'macos-26-intel' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-26]
        python: ['3.10', '3.14', '3.15']
        include:
          # Experimental Intel coverage: Magika has no ONNX Runtime wheel for Intel/Python 3.14.
          - os: macos-26-intel
            python: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.os == 'macos-26' && 'arm64' || 'x64' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: build/candidate/
      - name: Record runtime, runner image and action identities
        shell: bash
        run: |
          python -c "import platform,sys; print(sys.version); print(platform.machine()); print(platform.platform())"
          echo "Runner image: $ImageOS $ImageVersion"
          echo "checkout=3d3c42e5aac5ba805825da76410c181273ba90b1 setup-python=6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 download-artifact=9000827ccba6bdab643e8b6fd33ac0654aef8333 upload-artifact=cf430e030ddbb5b0abf93d22962f4752f3646cd9"
      - name: Verify transfer and install release wheel with declared dependency policy
        run: |
          python -m pip install --only-binary=:all: -r engine/requirements-test.txt -r engine/requirements-build.txt
          python tools/build_release.py --verify
          python tools/packaged_check.py install --bundle build/candidate --venv build/compat-env
          python tools/packaged_check.py install-current --bundle build/candidate
      - name: Engine pytest including contract, security and offline mocks
        run: python -I -m pytest engine/tests -m "not release and not soffice" --runxfail -q --junitxml=build/trace/junit-engine-${{ matrix.os }}-py${{ matrix.python }}.xml
      - name: Installed Core contract
        run: python -I -m pytest engine/tests/contract -q
      - name: Packaged integration outside source tree (spaces and Korean paths)
        env:
          MDFLOW_RELEASE_BUNDLE: ${{ github.workspace }}/build/candidate
        run: python -I -m pytest engine/tests/packaging -k "PT_01 or PT_05 or PT_06 or PT_08 or PT_14" -q --junitxml=build/trace/junit-pkg-${{ matrix.os }}-py${{ matrix.python }}.xml
      - name: Preserve execution evidence even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            build/trace/
            !build/trace/redgreen/*-tmp/**
          if-no-files-found: error

  legacy-libreoffice:
    name: legacy-libreoffice (ubuntu-24.04, 3.14)
    needs: candidate
    runs-on: ubuntu-24.04
    env:
      MDFLOW_TEST_INSTALLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          architecture: x64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: build/candidate/
      - name: Install headless LibreOffice legacy converters
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libreoffice-writer-nogui libreoffice-impress-nogui
          soffice --headless --version
      - name: Verify transfer and install release wheel
        run: |
          python -m pip install --only-binary=:all: -r engine/requirements-test.txt -r engine/requirements-build.txt
          python tools/build_release.py --verify
          python tools/packaged_check.py install-current --bundle build/candidate --venv build/legacy-libreoffice-env
      - name: Real LibreOffice legacy conversion
        run: python -I -m pytest engine/tests -m soffice --runxfail -q --junitxml=build/trace/junit-legacy-libreoffice-ubuntu-24.04-py3.14.xml
      - name: Require zero skipped LibreOffice tests
        run: python -c "import xml.etree.ElementTree as ET; cases = list(ET.parse('build/trace/junit-legacy-libreoffice-ubuntu-24.04-py3.14.xml').iter('testcase')); assert cases and all(c.find(k) is None for c in cases for k in ('skipped', 'failure', 'error')), 'LibreOffice tests must all execute and pass'"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: legacy-libreoffice
          path: |
            build/trace/
            !build/trace/redgreen/*-tmp/**
          if-no-files-found: error

  jest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          architecture: ${{ matrix.os == 'macos-26' && 'arm64' || 'x64' }}
      - name: Shell production build and Jest
        working-directory: shell
        run: |
          node --version
          npm --version
          npm ci
          npm run typecheck
          npm run build
          python ../tools/trace.py collect-shell --output ../build/trace/collection-shell-${{ matrix.os }}.json
          npm test -- --ci --runInBand --json --outputFile=../build/trace/jest-${{ matrix.os }}.json
          cp ../build/trace/junit-shell.xml ../build/trace/junit-shell-${{ matrix.os }}.xml
          JEST_JUNIT_OUTPUT_NAME=junit-codes-${{ matrix.os }}.xml npm test -- --ci --runInBand -t JT-SHL-19-01
      - name: Preserve full-suite results (code-set rerun is separate)
        if: ${{ always() }}
        shell: bash
        run: test -s build/trace/junit-shell-${{ matrix.os }}.xml
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shell-${{ matrix.os }}
          path: |
            build/trace/
            !build/trace/redgreen/*-tmp/**
          if-no-files-found: error

  contract-min:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          architecture: arm64
      - name: Install minimum Core 0.3.9 (also the reference producer)
        run: |
          python -m pip install --only-binary=:all: -r engine/requirements-test.txt "markitdown-gc==0.3.9"
          python -m pip show markitdown-gc
          python -I -m pytest engine/tests/contract -q --junitxml=build/trace/junit-contract-min.xml
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-min
          path: |
            build/trace/
            !build/trace/redgreen/*-tmp/**
          if-no-files-found: error

  contract-max:
    needs: contract-min
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          architecture: arm64
      - name: Resolve newest compatible endpoint; errors fail the gate
        run: |
          python -m pip index versions markitdown-gc --index-url https://pypi.org/simple
          python -m pip install --only-binary=:all: -r engine/requirements-test.txt "markitdown-gc>=0.3.9,<0.4"
          python -m pip show markitdown-gc
      - name: Deduplicate equal Core endpoints visibly
        run: python tools/contract_endpoint.py --suite engine/tests/contract --pytest pytest --output build/trace/junit-contract-max.xml
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-max
          path: |
            build/trace/
            !build/trace/redgreen/*-tmp/**
          if-no-files-found: error

  smoke:
    needs: candidate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-26]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.os == 'macos-26' && 'arm64' || 'x64' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: build/candidate/
      - name: Policy install, mdflow version and classify smoke
        env:
          MDFLOW_CI_TARGET: ${{ matrix.os }}
        run: python tools/packaged_check.py smoke --bundle build/candidate --venv build/smoke-env
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            build/trace/
            !build/trace/redgreen/*-tmp/**
          if-no-files-found: error

  trace:
    needs: [pytest, legacy-libreoffice, jest, contract-min, contract-max, smoke]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: engine-*
          path: build/trace/
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shell-*
          path: build/trace/
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: contract-*
          path: build/trace/
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reference-evidence
          path: build/trace/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: legacy-libreoffice
          path: build/trace/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: smoke-*
          path: build/trace/
          merge-multiple: true
      - run: |
          python -m pip install --only-binary=:all: -r engine/requirements-build.txt
          python tools/trace.py check
          python tools/trace.py report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-evidence
          path: |
            build/trace/
            !build/trace/redgreen/*-tmp/**
          if-no-files-found: error
