name: v2 Step 0

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.python == '3.15' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-15-intel]
        python: ['3.10', '3.14', '3.15']
    steps:
      # Candidate identities from 25_PACKAGING; action security review is pending.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Record resolved runtime and runner
        shell: bash
        run: |
          python -c "import platform, sys; print(sys.version); print(platform.machine()); print(platform.platform())"
          echo "Runner image: $ImageOS $ImageVersion"
          echo "checkout=11bd71901bbe5b1630ceea73d27597364c9af683 setup-python=a26af69be951a213d495a4c3e4e4022e16d87065 upload-artifact=ea165f8d65b6e75b540449e92b4886f43607fa02"
      - name: Install test tools and engine scaffolding
        run: |
          python -m pip install -r engine/requirements-test.txt
          python -m pip install --no-deps -e engine
      - name: Collect before running the red suite
        run: python -I -m pytest engine/tests --collect-only -q
      - name: Run meta tests (expected red at Step 0)
        run: python -I -m pytest engine/tests -q --junitxml=build/trace/junit-engine-${{ matrix.os }}-py${{ matrix.python }}.xml
      - name: Check registrations (expected red at Step 0)
        if: ${{ always() }}
        run: python tools/trace.py check
      - name: Preserve trace evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trace-${{ matrix.os }}-py${{ matrix.python }}
          path: build/trace/

  jest:
    # Enable with a reviewed exact Node patch and shell-local tool pins in step 8.
    if: ${{ false }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-15-intel]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Shell job placeholder
        run: echo "Pending shell/ and exact supported Node patch verification."
