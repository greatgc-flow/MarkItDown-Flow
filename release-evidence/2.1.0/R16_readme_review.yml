  Default legacy provider none has no egress. Only separately configured legacy OpenAI-compatible requests send selected
  image data. The trusted CLI command runs as a subprocess with caller-declared egress.
- 'Traced shell/src/process/node-apis.ts: a temporary 0600 input list is cleaned in finally; run journals store selected
  absolute inputs, destination, logical paths, source and member hashes, and outcome rows under ~/.mdflow/jobs/<vault
  digest>. Exclusive files use 0600 and new journal directories use 0700 on POSIX. The write bound is 128 MiB per journal;
  on successful close only the newest eight completed journals are retained per vault. Interrupted files remain. Coordinator
  writes run and partial summaries to plugin data.json; first input and output paths under home are shortened. Migration
  may retain sanitized data.v1.json. The optional log limits are five files of 1 MiB.'
- Verified photo-info bounds selected source bytes and digest-checks them; Core photo_metadata uses a private temporary
