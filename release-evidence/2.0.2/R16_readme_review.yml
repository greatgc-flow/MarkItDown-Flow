evidence:
- Reviewed the default none provider, optional approved openai-compatible raster requests, authorized URL/proxy scope
  and CLI-only command provider. The shell cannot configure a command provider. README names external bootstrap and
  user-selected execution. No automatic setup installer appears in the shell.
- Reviewed vault output validation and selected external input access, local venv executable, optional tools, temporary
  folders, cache and plugin-local logs. Provider key comes from the process environment; default none needs no provider
  account. README discloses potential duplicate costs when remote requests fail or repeat; consent UI shows the destination,
  billing warning and pending action.
- Checked the static PT-16 policy and the runtime privacy boundary. Inspected actual ONNX Runtime 1.32.0 Linux native
  library and verified the PyPI hashes of the macOS arm64 and Windows x64 3.14 wheels. Linux/macOS carry the native
  1DS collector. The shell forces ORT_DISABLE_TELEMETRY=1 before launching jobs and probes, and the standalone 2.0.2
  engine forces it on package initialization before Core imports the native backend. Magika 1.0.3 calls disable_telemetry_events
  before InferenceSession; Windows official x64 wheel contains the Microsoft.ML.ONNXRuntime TraceLogging provider.
  Reviewed the associated PT-16/JT-06 regressions. These are code and dependency checks, not a wire capture of every
  operating system.
- Reviewed v1-to-v2 migration/recovery and command registration, sanitized settings snapshots, external interpreter
  setup, and the staged writes that preserve settings on failed saves. Existing command IDs are retained.
- Independently verified SetupModal and the provider section both create a user-click anchor to the exact 2.0.2 README
  section. The link uses noreferrer/noopener and excludes user paths, keys and provider data. Independently exercised
  the EN/KO rendering assertions. The README subsequently explains all six relevant topics.
