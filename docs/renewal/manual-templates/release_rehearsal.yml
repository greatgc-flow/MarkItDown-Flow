# MAN-04  Release rehearsal on real desktops.   Validated by:
#   python tools/trace.py attest MAN-04      (also runs tools/release_evidence.py validate_rehearsal)
# Copy to release-evidence/2.0.0/release_rehearsal.yml, then replace every angle-bracket placeholder and every
# unfilled result value (use PASS only for a check you performed and saw succeed; FAIL blocks the release).
# Exactly six runs are required: windows, macos and linux, each with Obsidian "minimum" and "current".
# Always quote version numbers and digests so YAML keeps them as text. Each run installs from the downloaded
# release-candidate assets, and cancel_restart on Windows must be a real Windows cancellation.
id: MAN-04
reviewer: <REVIEWER NAME>
date: <YYYY-MM-DD>
commit: <CANDIDATE COMMIT SHA 40 HEX>
candidate_tag: "2.0.0"
manifest_version: "2.0.0"
versions_json_entry: "2.0.0"
inputs:
  - <FROZEN CANDIDATE RUN ID OR ARTIFACT USED>
checks:
  - {id: six_os_by_obsidian_runs_complete, result: TODO}
  - {id: downloaded_assets_match_release_candidate_digests, result: TODO}
  - {id: tag_manifest_and_versions_json_agree, result: TODO}
  - {id: windows_cancel_restart_on_real_windows, result: TODO}
evidence:
  - <SCREENSHOTS OR LOGS FOR THE RUNS AND WHERE THEY ARE KEPT>
